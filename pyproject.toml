[project]
name = "ghostrun"
version = "0.1.0"
description = "GhostRun dynamic malware analysis engine"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9",
    "wmi; sys_platform == 'win32'",
    "watchdog",
    "yara-python",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
