# --- COM/CLSID hijack (T1546.015) ---
# the hijacked value sits on CLSID\{guid}\InprocServer32 or
# \LocalServer32's default value, one level below the CLSID subkeys
# this walks.
# scoped to HKCU, the common variant that doesn't need admin rights.
# HKLM's CLSID tree is much bigger and needs elevation to write to.
- hive: HKCU
  path: 'Software\Classes\CLSID'
  mode: subkey_child_values
  watch_subkeys:
    - InprocServer32
    - LocalServer32
  category: com_hijack
  attck: T1546.015
  confidence: high

# --- file association hijack via shell\open\command (T1546.001) ---
# "*" is the fallback handler for every file type, so a hijack there
# runs on any file open.
# exefile covers .exe launches specifically.
- hive: HKCU
  path: 'Software\Classes\*\shell\open\command'
  mode: values
  category: file_assoc_hijack
  attck: T1546.001
  confidence: high
- hive: HKCU
  path: 'Software\Classes\exefile\shell\open\command'
  mode: values
  category: file_assoc_hijack
  attck: T1546.001
  confidence: high

# --- environment variable persistence (T1574.012) ---
