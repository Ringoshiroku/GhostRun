# hostnames suppressed as known-benign noise.
# this matters more here than elsewhere: every network_behavior event
# is capture-derived and stamped with the sample's root_pid,
# regardless of which process actually made the connection.
# so without this, every routine OS telemetry, update, or
# certificate-check connection seen during the analysis window
# would be reported as if the sample made it.
